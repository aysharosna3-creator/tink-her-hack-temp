<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FindMyBus — Book your bus tickets online or offline">
    <title>FindMyBus — Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="ticket">
    <div class="container">

        <a href="journey.html" class="back-link">← Back to Journey</a>

        <!-- Ticket Icons -->
        <div class="ticket-header">
            <div class="ticket-icons"><img src="ticket.svg" alt="Ticket" style="width:80px;height:80px;" /></div>
            <p class="ticket-quote">"Every journey begins with a single ticket — make yours count!"</p>
        </div>

        <h1 class="page-headline text-center mb-20"><img src="ticket.svg" alt="Ticket"
                style="width:28px;height:28px;vertical-align:middle;" /> Book Your Ticket</h1>

        <!-- Booking Form -->
        <div class="glass-card mb-20">
            <div class="input-group">
                <label>📅 Travel Date</label>
                <input type="date" id="tDate">
            </div>
            <div class="input-group">
                <label>📍 From</label>
                <input type="text" id="tFrom" placeholder="Starting point">
            </div>
            <div class="input-group">
                <label>📍 To</label>
                <input type="text" id="tTo" placeholder="Destination">
            </div>
            <div class="input-group">
                <label>🚌 Bus Type</label>
                <select id="tBusType">
                    <option value="local">Local Bus</option>
                    <option value="ac">A/C Bus</option>
                    <option value="nonac">Non A/C Bus</option>
                    <option value="ksrtc">KSRTC</option>
                </select>
            </div>
            <div class="input-group">
                <label>🕐 Preferred Time</label>
                <input type="text" id="tTime" placeholder="e.g. 08:00 AM">
            </div>
        </div>

        <!-- Ticket Rate -->
        <div class="rate-display">
            <div class="rate-label">Estimated Fare</div>
            <div class="rate-value" id="ticketRate">₹—</div>
        </div>

        <!-- Payment Toggle -->
        <div class="section-title">💳 Payment Method</div>
        <div class="payment-toggle mb-20">
            <button class="active" data-mode="online">💳 Online</button>
            <button data-mode="offline">💵 Offline</button>
        </div>

        <!-- Confirm Button -->
        <button class="btn-confirm" id="confirmTicket">
            ✨ Confirm Booking
        </button>

    </div>

    <script src="app.js"></script>
</body>

</html>
