<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plan your new journey with FindMyBus — bus time, tracking, seat booking and more">
    <title>FindMyBus — Plan Your Journey</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="journey">
    <div class="container">

        <a href="index.html" class="back-link">← Back to Search</a>

        <h1 class="page-headline" style="color:#7c6bc4">Plan Your New Journey</h1>
        <p class="page-sub">Choose a feature below to get started ✨</p>

        <!-- Selected Bus -->
        <div class="selected-bus-badge" id="selectedBusName">🚌 Select a bus first</div>

        <!-- Feature Grid (invisible table — 2 col × 3 row) -->
        <div class="feature-grid">

            <a href="bustime.html" class="feature-card">
                <div class="ficon lavender">
                    <!-- Bus icon -->
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7c6bc4" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="14" rx="2" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                        <circle cx="7.5" cy="19.5" r="1.5" />
                        <circle cx="16.5" cy="19.5" r="1.5" />
                    </svg>
                </div>
                <div class="flabel">Bus Time</div>
            </a>

            <a href="tracking.html" class="feature-card">
                <div class="ficon pink">
                    <!-- Tracking / Map pin icon -->
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e57373" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                </div>
                <div class="flabel">Bus Tracking</div>
            </a>

            <a href="seats.html" class="feature-card">
                <div class="ficon mint">
                    <!-- Seat icon -->
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4" />
                        <rect x="3" y="11" width="18" height="6" rx="2" />
                        <line x1="6" y1="17" x2="6" y2="20" />
                        <line x1="18" y1="17" x2="18" y2="20" />
                    </svg>
                </div>
                <div class="flabel">Seat Booking</div>
            </a>

            <a href="support.html" class="feature-card">
                <div class="ficon peach">
                    <!-- Customer care icon -->
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff9800" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M22 16.92V19.92a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z" />
                    </svg>
                </div>
                <div class="flabel">24/7 Customer Support</div>
            </a>

            <a href="ticket.html" class="feature-card">
                <div class="ficon sky">
                    <!-- Ticket icon -->
                    <img src="ticket.svg" alt="Ticket" style="width:32px;height:32px;" />
                </div>
                <div class="flabel">Tickset Booking</div>
            </a>

            <a href="offers.html" class="feature-card">
                <div class="ficon yellow">
                    <!-- Offers / Gift icon -->
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffa000" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 12 20 22 4 22 4 12" />
                        <rect x="2" y="7" width="20" height="5" />
                        <line x1="12" y1="22" x2="12" y2="7" />
                        <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" />
                        <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" />
                    </svg>
                </div>
                <div class="flabel">Offers</div>
            </a>
        </div>

        <!-- Travel History -->
        <div class="section-title">🕘 Recently Viewed</div>
        <div id="historyList"></div>

    </div>

    <script src="app.js"></script>
</body>

</html>
