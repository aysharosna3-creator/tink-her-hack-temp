<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4edf9"/>
      <stop offset="100%" style="stop-color:#bde0f5"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="150" cy="150" r="140" fill="url(#skyBg)"/>
  <circle cx="150" cy="150" r="140" fill="none" stroke="#c8e4f3" stroke-width="3"/>

  <!-- Clouds -->
  <g opacity="0.7">
    <ellipse cx="55" cy="160" rx="25" ry="12" fill="white"/>
    <ellipse cx="42" cy="155" rx="18" ry="10" fill="white"/>
    <ellipse cx="68" cy="155" rx="18" ry="10" fill="white"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="240" cy="190" rx="20" ry="10" fill="white"/>
    <ellipse cx="228" cy="185" rx="15" ry="8" fill="white"/>
    <ellipse cx="252" cy="185" rx="15" ry="8" fill="white"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="100" cy="210" rx="18" ry="9" fill="white"/>
    <ellipse cx="88" cy="206" rx="14" ry="7" fill="white"/>
    <ellipse cx="112" cy="206" rx="14" ry="7" fill="white"/>
  </g>

  <!-- Dashed route arc -->
  <path d="M 80 100 Q 150 30 230 80" fill="none" stroke="#6b7b8d" stroke-width="2.5" stroke-dasharray="8,6" opacity="0.5"/>
  <!-- Arrow at end of arc -->
  <polygon points="232,80 222,72 226,84" fill="#6b7b8d" opacity="0.5"/>

  <!-- Antenna -->
  <line x1="175" y1="95" x2="185" y2="70" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="186" cy="67" r="4" fill="#999"/>

  <!-- Bus Body -->
  <rect x="85" y="100" width="140" height="70" rx="20" fill="#fdd835"/>
  <!-- Bus body top highlight -->
  <rect x="85" y="100" width="140" height="25" rx="20" fill="#f9a825" opacity="0.6"/>

  <!-- Windows -->
  <rect x="100" y="112" width="25" height="18" rx="5" fill="#e3f2fd" opacity="0.9"/>
  <rect x="132" y="112" width="25" height="18" rx="5" fill="#e3f2fd" opacity="0.9"/>
  <rect x="164" y="112" width="25" height="18" rx="5" fill="#e3f2fd" opacity="0.9"/>

  <!-- Eyes -->
  <circle cx="130" cy="148" r="10" fill="white"/>
  <circle cx="175" cy="148" r="10" fill="white"/>
  <circle cx="132" cy="146" r="6" fill="#2c3e6b"/>
  <circle cx="177" cy="146" r="6" fill="#2c3e6b"/>
  <circle cx="134" cy="143" r="2.5" fill="white"/>
  <circle cx="179" cy="143" r="2.5" fill="white"/>

  <!-- Smile -->
  <path d="M 138 158 Q 152 170 168 158" stroke="#2c3e6b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="118" cy="155" rx="7" ry="4" fill="#f8bbd0" opacity="0.5"/>
  <ellipse cx="188" cy="155" rx="7" ry="4" fill="#f8bbd0" opacity="0.5"/>

  <!-- Front bumper -->
  <rect x="90" y="168" width="130" height="8" rx="4" fill="#bdbdbd"/>

  <!-- Headlights -->
  <circle cx="92" cy="148" r="5" fill="#ffe082"/>
  <circle cx="218" cy="148" r="5" fill="#ffe082"/>

  <!-- Wheels -->
  <circle cx="118" cy="178" r="11" fill="#3a3550"/>
  <circle cx="118" cy="178" r="5" fill="#e0d6f2"/>
  <circle cx="192" cy="178" r="11" fill="#3a3550"/>
  <circle cx="192" cy="178" r="5" fill="#e0d6f2"/>

  <!-- Location Pin on bus side -->
  <g transform="translate(195,135) scale(0.5)">
    <path d="M 0 -20 C -12 -20 -20 -10 -20 0 C -20 15 0 30 0 30 C 0 30 20 15 20 0 C 20 -10 12 -20 0 -20 Z" fill="#2c3e6b" opacity="0.7"/>
    <circle cx="0" cy="-2" r="7" fill="#e3f2fd"/>
  </g>

  <!-- Stripes on bus -->
  <line x1="160" y1="155" x2="195" y2="155" stroke="#2c3e6b" stroke-width="1.5" opacity="0.3"/>
  <line x1="165" y1="160" x2="195" y2="160" stroke="#2c3e6b" stroke-width="1.5" opacity="0.3"/>

  <!-- FindMyBus Text -->
  <text x="150" y="240" text-anchor="middle" font-family="'Nunito', 'Arial Rounded MT Bold', 'Poppins', sans-serif" font-size="32" font-weight="900" fill="#1a2a4a" letter-spacing="-0.5">FindMyBus</text>
</svg>
