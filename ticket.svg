<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="ticketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4edf9"/>
      <stop offset="100%" style="stop-color:#bde0f5"/>
    </linearGradient>
    <linearGradient id="ticketColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8a4a4"/>
      <stop offset="100%" style="stop-color:#e8787e"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="150" cy="150" r="135" fill="url(#ticketBg)"/>
  <circle cx="150" cy="150" r="135" fill="none" stroke="#c8e4f3" stroke-width="4"/>

  <!-- Small Clouds -->
  <g opacity="0.5">
    <ellipse cx="65" cy="210" rx="22" ry="10" fill="white"/>
    <ellipse cx="53" cy="206" rx="16" ry="8" fill="white"/>
    <ellipse cx="77" cy="206" rx="16" ry="8" fill="white"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="230" cy="220" rx="20" ry="9" fill="white"/>
    <ellipse cx="218" cy="216" rx="14" ry="7" fill="white"/>
    <ellipse cx="242" cy="216" rx="14" ry="7" fill="white"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="80" cy="80" rx="18" ry="9" fill="white"/>
    <ellipse cx="68" cy="76" rx="13" ry="7" fill="white"/>
    <ellipse cx="92" cy="76" rx="13" ry="7" fill="white"/>
  </g>

  <!-- Ticket Shape (rotated slightly) -->
  <g transform="translate(150,140) rotate(-15)">
    <!-- Ticket body -->
    <rect x="-100" y="-50" width="200" height="100" rx="12" fill="url(#ticketColor)"/>

    <!-- Scalloped edges on top -->
    <circle cx="-80" cy="-50" r="6" fill="url(#ticketBg)"/>
    <circle cx="-55" cy="-50" r="6" fill="url(#ticketBg)"/>
    <circle cx="-30" cy="-50" r="6" fill="url(#ticketBg)"/>
    <circle cx="-5" cy="-50" r="6" fill="url(#ticketBg)"/>
    <circle cx="20" cy="-50" r="6" fill="url(#ticketBg)"/>
    <circle cx="45" cy="-50" r="6" fill="url(#ticketBg)"/>
    <circle cx="70" cy="-50" r="6" fill="url(#ticketBg)"/>

    <!-- Scalloped edges on bottom -->
    <circle cx="-80" cy="50" r="6" fill="url(#ticketBg)"/>
    <circle cx="-55" cy="50" r="6" fill="url(#ticketBg)"/>
    <circle cx="-30" cy="50" r="6" fill="url(#ticketBg)"/>
    <circle cx="-5" cy="50" r="6" fill="url(#ticketBg)"/>
    <circle cx="20" cy="50" r="6" fill="url(#ticketBg)"/>
    <circle cx="45" cy="50" r="6" fill="url(#ticketBg)"/>
    <circle cx="70" cy="50" r="6" fill="url(#ticketBg)"/>

    <!-- Big scallop notches on sides -->
    <circle cx="-100" cy="0" r="10" fill="url(#ticketBg)"/>
    <circle cx="100" cy="0" r="10" fill="url(#ticketBg)"/>

    <!-- Perforation line -->
    <line x1="20" y1="-45" x2="20" y2="45" stroke="#c4545a" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- Hearts on ticket -->
    <g transform="translate(55,-25) scale(0.5)" fill="#c4545a" opacity="0.6">
      <path d="M 0 5 C -5 -5 -15 -5 -15 3 C -15 10 0 18 0 18 C 0 18 15 10 15 3 C 15 -5 5 -5 0 5 Z"/>
    </g>
    <g transform="translate(65,20) scale(0.4)" fill="#c4545a" opacity="0.5">
      <path d="M 0 5 C -5 -5 -15 -5 -15 3 C -15 10 0 18 0 18 C 0 18 15 10 15 3 C 15 -5 5 -5 0 5 Z"/>
    </g>

    <!-- Mini Bus on ticket -->
    <g transform="translate(-35,0) scale(0.45)">
      <!-- Bus Body -->
      <rect x="-50" y="-25" width="100" height="50" rx="14" fill="#fdd835"/>
      <rect x="-50" y="-25" width="100" height="18" rx="14" fill="#f9a825" opacity="0.5"/>
      <!-- Windows -->
      <rect x="-38" y="-18" width="18" height="12" rx="3" fill="#e3f2fd" opacity="0.9"/>
      <rect x="-14" y="-18" width="18" height="12" rx="3" fill="#e3f2fd" opacity="0.9"/>
      <rect x="10" y="-18" width="18" height="12" rx="3" fill="#e3f2fd" opacity="0.9"/>
      <!-- Eyes -->
      <circle cx="-10" cy="10" r="7" fill="white"/>
      <circle cx="20" cy="10" r="7" fill="white"/>
      <circle cx="-8" cy="8" r="4" fill="#2c3e6b"/>
      <circle cx="22" cy="8" r="4" fill="#2c3e6b"/>
      <circle cx="-7" cy="6" r="1.5" fill="white"/>
      <circle cx="23" cy="6" r="1.5" fill="white"/>
      <!-- Smile -->
      <path d="M -4 17 Q 5 24 15 17" stroke="#2c3e6b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Wheels -->
      <circle cx="-25" cy="28" r="8" fill="#3a3550"/>
      <circle cx="-25" cy="28" r="3.5" fill="#e0d6f2"/>
      <circle cx="30" cy="28" r="8" fill="#3a3550"/>
      <circle cx="30" cy="28" r="3.5" fill="#e0d6f2"/>
    </g>

  </g>
</svg>
